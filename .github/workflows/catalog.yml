# Live check of data/newsletter-catalog.json (`npm run verify:catalog`).
#
# The agent environment cannot reach the newsletter sites, so the catalog's feed URLs are
# written as `verified: false`. This job runs the app's own feed discovery (robots.txt
# respected, Impartly user agent, SSRF checks, size and time limits) against each entry
# from a GitHub runner and writes a table to the job summary. Report only: it does not
# fail when a site has no feed or is down, and it changes nothing in the repository.
#
# Runs on pull requests that touch the catalog or the web-source code, and by hand. Not on
# every push, to keep requests to the sites few (about 3 to 10 small GETs per entry, plus
# the source probes in tests/catalog/probes.ts: about 30 GETs in all, link following capped).
# Free: GitHub-hosted runner, no secrets.

name: Catalog check

on:
  pull_request:
    paths:
      - "data/newsletter-catalog.json"
      - "lib/sources/web/**"
      - "tests/catalog/**"
      - ".github/workflows/catalog.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify newsletter catalog (live, report only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify catalog
        run: npm run verify:catalog
